# 生产环境 nginx 配置（NAS host 网络模式）
#
# 说明：
#   - listen 8087：host 网络下直接占用宿主机端口（非 80）
#   - 后端 127.0.0.1:3100：host 网络下无 docker DNS，不能用 server:3000
#   - 缓存策略：
#       * /assets/* 内容哈希命名 → 长期不可变缓存（immutable）
#       * index.html / SPA 回退 → 禁止缓存（no-cache）
#       原因：改版后浏览器若持有旧 index.html，会引用已失效的资源哈希导致 404 白屏。
server {
    listen 8087;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 与后端 MAX_FILE_SIZE 保持一致，避免 nginx 先返回 413
    client_max_body_size 12M;

    # 内容哈希静态资源：长期不可变缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API
    location /api {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 工单附件静态资源（图片缩略图直接走这里）
    location /uploads {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其余路由（含 SPA 回退到 index.html）：禁止缓存 HTML
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
